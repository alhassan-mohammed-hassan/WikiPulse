
services:

  kafka:
    image: apache/kafka:4.3.1
    container_name: wikipulse-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data
    mem_limit: 1g
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
        ]
      interval: 15s
      timeout: 10s
      retries: 5

  nifi:
    image: apache/nifi:2.12.0
    container_name: wikipulse-nifi
    hostname: nifi
    ports:
      - "8443:8443"
    environment:
      NIFI_WEB_HTTPS_PORT: 8443
      SINGLE_USER_CREDENTIALS_USERNAME: ${NIFI_USERNAME}
      SINGLE_USER_CREDENTIALS_PASSWORD: ${NIFI_PASSWORD}
      NIFI_JVM_HEAP_INIT: 512m
      NIFI_JVM_HEAP_MAX: 1g
    volumes:
      - nifi_conf:/opt/nifi/nifi-current/conf
      - nifi_database:/opt/nifi/nifi-current/database_repository
      - nifi_flowfile:/opt/nifi/nifi-current/flowfile_repository
      - nifi_content:/opt/nifi/nifi-current/content_repository
      - nifi_provenance:/opt/nifi/nifi-current/provenance_repository
    depends_on:
      kafka:
        condition: service_healthy
    mem_limit: 2g

  bridge:
    build:
      context: ./bridge
      dockerfile: Dockerfile
    container_name: wikipulse-bridge
    environment:
      NIFI_URL: http://nifi:8081/contentListener
    depends_on:
      - nifi
    restart: unless-stopped
    mem_limit: 256m


  postgres:
    image: postgres:17-alpine
    container_name: wikipulse-postgres
    environment:
      POSTGRES_DB: wikipulse
      POSTGRES_USER: wikipulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wikipulse -d wikipulse"]
      interval: 10s
      timeout: 5s
      retries: 5

  spark:
    image: spark:4.3.0-python3
    container_name: wikipulse-spark
    ports:
      - "4040:4040"
    environment:
      POSTGRES_URL: jdbc:postgresql://postgres:5432/wikipulse
      POSTGRES_USER: wikipulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      HOME: /tmp
      SPARK_LOCAL_DIRS: /tmp/spark-local
    command:
      - /opt/spark/bin/spark-submit
      - --conf
      - spark.jars.ivy=/tmp/.ivy2
      - --master
      - local[2]
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.13:4.3.0,org.postgresql:postgresql:42.7.8
      - /opt/wikipulse/jobs/streaming_job.py
    volumes:
      - ./spark/jobs:/opt/wikipulse/jobs
      - ./data:/opt/wikipulse/data
      - ./data/checkpoints:/opt/wikipulse/checkpoints
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 2g


  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: wikipulse-dashboard
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: wikipulse
      DB_USER: wikipulse
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 512m

volumes:
  kafka_data:
  nifi_conf:
  nifi_database:
  nifi_flowfile:
  nifi_content:
  nifi_provenance:
  pg_data:
